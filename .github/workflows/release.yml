name: Release Fantasy Continent

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.0.1 或 v1.0.1；留空则读取 package.json 当前版本）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  prepare:
    name: Prepare Version, Checks & Chinese Changelog
    # 防循环触发保护：跳过由机器人账号触发或提交信息含 [skip ci] / [skip release] 的分支推送；Tag 与手动触发始终执行
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sync.outputs.version }}
      tag: ${{ steps.sync.outputs.tag }}
      android_version_code: ${{ steps.sync.outputs.android_version_code }}
      release_date: ${{ steps.sync.outputs.release_date }}
      is_prerelease: ${{ steps.sync.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No npm lockfile detected (using bun.lock/package.json); running npm install..."
            npm install --no-audit --no-fund
          fi

      - name: Resolve & sync release version
        id: sync
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/sync-version.mjs
          VER=$(node -p "require('./package.json').version")
          if [[ "$VER" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Trigger: event=${{ github.event_name }}, ref_type=${{ github.ref_type }}, ref=${{ github.ref_name }}, sha=${{ github.sha }}"
          echo "Resolved version: $VER"

      - name: Generate Chinese version.json & release notes
        env:
          RELEASE_VERSION: ${{ steps.sync.outputs.version }}
          RELEASE_DATE: ${{ steps.sync.outputs.release_date }}
        run: |
          node scripts/generate-version-json.mjs --version "$RELEASE_VERSION" --date "$RELEASE_DATE"
          node scripts/generate-release-notes.mjs --out RELEASE_NOTES.md
          echo "=== Generated public/version.json ==="
          head -n 35 public/version.json

      - name: Run TypeScript check & unit tests before cross-platform builds
        run: |
          npx tsc --noEmit
          npm test

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          if-no-files-found: error
          path: |
            public/version.json
            RELEASE_NOTES.md

  build-web:
    name: Build Web & PWA
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Sync version & build Web/PWA bundle
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
          FIREBASE_APPLET_CONFIG_JSON: ${{ secrets.FIREBASE_APPLET_CONFIG_JSON }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
        run: |
          node scripts/sync-version.mjs --version "$RELEASE_VERSION"
          npm run build

      - name: Verify & package Web/PWA outputs
        run: |
          for f in dist/index.html dist/manifest.webmanifest dist/sw.js dist/version.json; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty Web/PWA build artifact: $f"
              exit 1
            fi
          done
          mkdir -p artifacts
          cp dist/version.json artifacts/version.json
          tar -czf artifacts/fantasy-continent-web-pwa.tar.gz -C dist .
          ls -lh artifacts/

      - name: Upload Web & PWA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-pwa-artifacts
          if-no-files-found: error
          path: |
            artifacts/version.json
            artifacts/fantasy-continent-web-pwa.tar.gz

  build-windows:
    name: Build Windows EXE (Setup & Portable)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-tauri-v2

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Sync version & prepare version.json
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
        run: |
          node scripts/sync-version.mjs --version "$RELEASE_VERSION"
          node scripts/generate-version-json.mjs --version "$RELEASE_VERSION" --date "$RELEASE_DATE"

      - name: Build Tauri Windows NSIS & portable EXE
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
          FIREBASE_APPLET_CONFIG_JSON: ${{ secrets.FIREBASE_APPLET_CONFIG_JSON }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
        run: |
          npx tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis

      - name: Collect, verify & rename Windows EXE artifacts
        shell: bash
        run: |
          mkdir -p artifacts

          SETUP_EXE=$(find src-tauri/target -path '*/release/bundle/nsis/*.exe' -type f | head -n 1 || true)
          PORTABLE_EXE=$(find src-tauri/target -path '*/release/fantasy-continent.exe' ! -path '*/bundle/*' -type f | head -n 1 || true)
          if [ -z "$PORTABLE_EXE" ]; then
            PORTABLE_EXE=$(find src-tauri/target -path '*/release/*.exe' ! -path '*/bundle/*' ! -path '*/deps/*' ! -path '*/build/*' ! -path '*/incremental/*' -type f | head -n 1 || true)
          fi

          if [ -z "$SETUP_EXE" ] || [ ! -s "$SETUP_EXE" ]; then
            echo "::error::Windows NSIS 安装包 (.exe) 未生成！以下为实际输出目录清单："
            find src-tauri/target -maxdepth 5 -name '*.exe' || true
            exit 1
          fi

          if [ -z "$PORTABLE_EXE" ] || [ ! -s "$PORTABLE_EXE" ]; then
            echo "::error::Windows 绿色便携版 (.exe) 未找到！以下为实际输出目录清单："
            find src-tauri/target -maxdepth 5 -name '*.exe' || true
            exit 1
          fi

          cp "$SETUP_EXE" artifacts/fantasy-continent-windows-setup.exe
          cp "$PORTABLE_EXE" artifacts/fantasy-continent-windows-portable.exe
          echo "Windows Setup    <- $SETUP_EXE"
          echo "Windows Portable <- $PORTABLE_EXE"
          ls -lh artifacts/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            artifacts/fantasy-continent-windows-setup.exe
            artifacts/fantasy-continent-windows-portable.exe

  build-android:
    name: Build Android Signed APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Android signing secrets & decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::缺少必需的 GitHub Secret: $var，无法执行 Android 正式包签名！"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/fantasy-continent-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"; then
            echo "::error::KEYSTORE_BASE64 解码失败，请确认传入的是合法的 Base64 编码字符串。"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::解码后的 Keystore 文件为空。"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          if ! keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore 校验失败：KEYSTORE_PASSWORD 或 KEY_ALIAS 与密钥库不匹配。"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          echo "✅ Keystore 解码及别名 ($KEY_ALIAS) 校验通过。"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Web assets & sync Capacitor Android
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
          FIREBASE_APPLET_CONFIG_JSON: ${{ secrets.FIREBASE_APPLET_CONFIG_JSON }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
        run: |
          node scripts/sync-version.mjs --version "$RELEASE_VERSION"
          npm run build
          npx cap sync android

      - name: Build signed Release APK
        env:
          CI: "true"
          KEYSTORE_PATH: ${{ runner.temp }}/fantasy-continent-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            -PAPP_VERSION_NAME="$RELEASE_VERSION" \
            -PAPP_VERSION_CODE="$ANDROID_VERSION_CODE"

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fantasy-continent-release.jks"

      - name: Collect & verify signed APK signature
        run: |
          mkdir -p artifacts
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1 || true)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::未找到已签名的 Android Release APK！以下为构建输出："
            find android/app/build/outputs -maxdepth 4 || true
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name 'apksigner' | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK signature with $APKSIGNER..."
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi

          cp "$APK_PATH" artifacts/fantasy-continent-android.apk
          ls -lh artifacts/fantasy-continent-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          path: artifacts/fantasy-continent-android.apk

  build-linux:
    name: Build Linux AppImage & .deb (Ubuntu 22.04 / Debian 12 compatible)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            libfuse2 \
            squashfs-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: linux-ubuntu22-tauri-v2

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Sync version & build Linux AppImage / .deb
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
          FIREBASE_APPLET_CONFIG_JSON: ${{ secrets.FIREBASE_APPLET_CONFIG_JSON }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          node scripts/sync-version.mjs --version "$RELEASE_VERSION"
          node scripts/generate-version-json.mjs --version "$RELEASE_VERSION" --date "$RELEASE_DATE"
          npx tauri build --bundles appimage,deb

      - name: Collect, verify & rename Linux packages
        run: |
          mkdir -p artifacts
          APPIMAGE_PATH=$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -type f | head -n 1 || true)
          DEB_PATH=$(find src-tauri/target -path '*/release/bundle/deb/*.deb' -type f | head -n 1 || true)

          if [ -z "$APPIMAGE_PATH" ] || [ ! -s "$APPIMAGE_PATH" ]; then
            echo "::error::Linux AppImage 构建产物未找到！输出清单："
            find src-tauri/target -maxdepth 5 -path '*/bundle/*' || true
            exit 1
          fi
          if [ -z "$DEB_PATH" ] || [ ! -s "$DEB_PATH" ]; then
            echo "::error::Linux .deb 构建产物未找到！输出清单："
            find src-tauri/target -maxdepth 5 -path '*/bundle/*' || true
            exit 1
          fi

          DEB_PKG=$(dpkg-deb -f "$DEB_PATH" Package)
          echo "Detected .deb Package field: $DEB_PKG"
          if [ "$DEB_PKG" != "fantasy-continent" ]; then
            echo "::error::Debian 包名校验失败: 实际为 '$DEB_PKG'，要求必须为纯小写 ASCII 'fantasy-continent'"
            exit 1
          fi
          dpkg-deb -I "$DEB_PATH"

          cp "$APPIMAGE_PATH" artifacts/fantasy-continent-linux.AppImage
          chmod +x artifacts/fantasy-continent-linux.AppImage
          cp "$DEB_PATH" artifacts/fantasy-continent-linux.deb
          ls -lh artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            artifacts/fantasy-continent-linux.AppImage
            artifacts/fantasy-continent-linux.deb

  publish-release:
    name: Verify Assets, Generate SHA256SUMS & Publish Release
    needs: [prepare, build-web, build-windows, build-android, build-linux]
    runs-on: ubuntu-latest
    concurrency:
      group: github-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Stage artifacts, verify completeness & compute SHA256SUMS.txt
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp downloaded-artifacts/release-metadata/RELEASE_NOTES.md ./RELEASE_NOTES.md
          cp downloaded-artifacts/web-pwa-artifacts/version.json release-assets/version.json
          cp downloaded-artifacts/web-pwa-artifacts/fantasy-continent-web-pwa.tar.gz release-assets/fantasy-continent-web-pwa.tar.gz
          cp downloaded-artifacts/windows-artifacts/fantasy-continent-windows-setup.exe release-assets/fantasy-continent-windows-setup.exe
          cp downloaded-artifacts/windows-artifacts/fantasy-continent-windows-portable.exe release-assets/fantasy-continent-windows-portable.exe
          cp downloaded-artifacts/android-artifacts/fantasy-continent-android.apk release-assets/fantasy-continent-android.apk
          cp downloaded-artifacts/linux-artifacts/fantasy-continent-linux.AppImage release-assets/fantasy-continent-linux.AppImage
          cp downloaded-artifacts/linux-artifacts/fantasy-continent-linux.deb release-assets/fantasy-continent-linux.deb

          REQUIRED_FILES=(
            "fantasy-continent-windows-setup.exe"
            "fantasy-continent-windows-portable.exe"
            "fantasy-continent-android.apk"
            "fantasy-continent-linux.AppImage"
            "fantasy-continent-linux.deb"
            "fantasy-continent-web-pwa.tar.gz"
            "version.json"
          )

          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "release-assets/$f" ]; then
              echo "::error::发布产物缺失或为空文件: release-assets/$f"
              exit 1
            fi
          done

          (
            cd release-assets
            sha256sum "${REQUIRED_FILES[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          echo "=== Verified Release Assets ==="
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Prepare existing GitHub Release for idempotent re-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; cleaning matching assets before re-upload..."
            for asset in \
              fantasy-continent-windows-setup.exe \
              fantasy-continent-windows-portable.exe \
              fantasy-continent-android.apk \
              fantasy-continent-linux.AppImage \
              fantasy-continent-linux.deb \
              fantasy-continent-web-pwa.tar.gz \
              version.json \
              SHA256SUMS.txt; do
              gh release delete-asset "$TAG_NAME" "$asset" --repo "${{ github.repository }}" --yes || true
            done
          else
            echo "Release $TAG_NAME does not exist yet; will be created."
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "《幻想大陆》${{ needs.prepare.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_prerelease != 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/fantasy-continent-windows-setup.exe
            release-assets/fantasy-continent-windows-portable.exe
            release-assets/fantasy-continent-android.apk
            release-assets/fantasy-continent-linux.AppImage
            release-assets/fantasy-continent-linux.deb
            release-assets/fantasy-continent-web-pwa.tar.gz
            release-assets/version.json
            release-assets/SHA256SUMS.txt
