[package]
name = "fantasy-continent"
version = "1.0.0"
description = "幻想大陆 · 觉醒编年史 — 跨平台暗黑幻想动作 RPG"
authors = ["Zhoyi011"]
edition = "2021"

[lib]
name = "fantasy_continent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
